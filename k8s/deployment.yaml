apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
  labels:
    app: bonos-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1                             
          topologyKey: kubernetes.io/hostname     
          whenUnsatisfiable: ScheduleAnyway      
          labelSelector:
            matchLabels:
              app: bonos-service                

      containers:
        - name: bonos-service
          image: 631932931672.dkr.ecr.us-east-1.amazonaws.com/bonos-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: JWT_SECRET
            - name: READY_MAX_MEM_PERCENT
              value: "90.0"            
            - name: BONOS_N_EVENTOS
              value: "10"

          livenessProbe:
            httpGet:
              path: /live
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8004
            initialDelaySeconds: 10     
            periodSeconds: 5
            timeoutSeconds: 2

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"